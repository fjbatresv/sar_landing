name: Build and deploy landing
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check source for private identifiers
        run: node tools/check-sanitized.mjs
      - name: Resolve Pages host and base path
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            domain_re='^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'
            if [[ ! "$CUSTOM_DOMAIN" =~ $domain_re ]]; then echo "Invalid PAGES_CUSTOM_DOMAIN" >&2; exit 1; fi
            site="https://$CUSTOM_DOMAIN"
            base="/"
          else
            site="https://${OWNER,,}.github.io"
            base="/$REPO_NAME/"
          fi
          { echo "ASTRO_SITE=$site"; echo "ASTRO_BASE=$base"; echo "PAGES_CNAME=$CUSTOM_DOMAIN"; } >> "$GITHUB_ENV"
      - run: npm run build
      - name: Check built site for private identifiers
        run: node tools/check-sanitized.mjs
      - name: Add custom domain file
        if: ${{ vars.PAGES_CUSTOM_DOMAIN != '' }}
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: printf '%s\n' "$CUSTOM_DOMAIN" > dist/CNAME
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
